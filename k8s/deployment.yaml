apiVersion: apps/v1
kind: Deployment
metadata:
  name: ti-apap
  namespace: default
  labels:
    app: ti-apap
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ti-apap
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ti-apap
        version: v1
    spec:
      containers:
      - name: vehicle-rental-backend
        image: ${DOCKER_IMAGE_NAME}:REPLACE_ME_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DATABASE_URL_PROD
          valueFrom:
            configMapKeyRef:
              name: ti-apap-configmap
              key: DATABASE_URL_PROD
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: ti-apap-configmap
              key: DATABASE_USERNAME
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ti-apap-secret
              key: DATABASE_PASSWORD
        - name: _APP_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ti-apap-secret
              key: _APP_SECRET_KEY
        - name: SCORS_ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: ti-apap-secret
              key: SCORS_ALLOWED_ORIGINS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

