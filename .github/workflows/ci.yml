name: CI Pipeline

on:
  push:
    branches:
      - feat/praktikum-9

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR (skip tests)
        run: ./gradlew clean build -x test

      - name: Find & copy JAR
        run: cp $(find build/libs -name "*.jar" | head -n 1) app.jar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            app.jar
            Dockerfile.ci
            k8s/deployment.yaml
            k8s/service.yaml
            k8s/ingress.yaml
          retention-days: 1

  docker-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Login into Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -f Dockerfile.ci -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Install SSH
        run: sudo apt-get update && sudo apt-get install -y ssh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Docker
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Stop and remove old container if exists
            docker stop ti-apap-be 2>/dev/null || true
            docker rm ti-apap-be 2>/dev/null || true

            # Pull the latest image
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Run the new container
            docker run -d \
              --name ti-apap-be \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DATABASE_URL_PROD="${{ secrets.DATABASE_URL_PROD }}" \
              -e DATABASE_USERNAME="${{ secrets.DATABASE_USERNAME }}" \
              -e DATABASE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e APP_SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
              ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Show container status
            docker ps -a | grep ti-apap-be
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "Waiting for application to start..."
            sleep 10

            # Check if container is running
            if docker ps | grep -q ti-apap-be; then
              echo "✅ Container is running"
              docker logs ti-apap-be --tail 50
            else
              echo "❌ Container failed to start"
              docker logs ti-apap-be --tail 100
              exit 1
            fi
          ENDSSH
