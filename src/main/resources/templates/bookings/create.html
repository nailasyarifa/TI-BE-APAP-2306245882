<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Create Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #f5f5f5; padding: 20px 0; }
    .booking-container { max-width: 700px; margin: 0 auto; }
    .booking-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-header-custom { padding: 22px 20px; border-bottom: 1px solid #eee; }
    .card-header-custom h3 { margin: 0; color: #00a651; font-size: 22px; font-weight: 600; }
    .card-body-custom { padding: 22px; }
    .vehicle-card { background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .vehicle-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .vehicle-price { color: #00a651; font-size: 16px; font-weight: 700; }
    .price-details-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-top: 12px; }
    .btn-search { background-color: #00a651; border: none; border-radius: 4px; padding: 12px; font-size: 16px; color: white; width: 100%; margin-top: 12px; }
    .btn-proceed { background-color: #007bff; border: none; border-radius: 4px; padding: 10px 20px; color: white; }
    .btn-cancel { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 10px 18px; color: #666; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="booking-container">
    <div class="booking-card">
      <div class="card-header-custom">
        <h3>Create a New Booking</h3>
      </div>

      <div class="card-body-custom">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

        <!-- MAIN FORM (search) -->
        <form th:object="${createReq}" th:action="@{/bookings/create}" method="post" id="mainForm">
          <div th:if="${_csrf != null}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" th:field="*{includeDriver}" id="includeDriver"/>
              <label class="form-check-label" for="includeDriver">Include Driver?</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Pick-up Location</label>
            <select class="form-select" th:field="*{pickUpLocation}">
              <option value="">--Select--</option>
              <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}">Loc</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Drop-off Location</label>
            <select class="form-select" th:field="*{dropOffLocation}">
              <option value="">--Select--</option>
              <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}">Loc</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Pick-up Time</label>
            <input type="datetime-local" class="form-control" th:field="*{pickUpTime}"
                   th:value="${createReq.pickUpTime != null ? #temporals.format(createReq.pickUpTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Drop-off Time</label>
            <input type="datetime-local" class="form-control" th:field="*{dropOffTime}"
                   th:value="${createReq.dropOffTime != null ? #temporals.format(createReq.dropOffTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
          </div>

          <div class="mb-3">
            <label class="form-label">Capacity Needed</label>
            <input type="number" min="0" class="form-control" th:field="*{capacityNeeded}"/>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Transmission:</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" th:field="*{transmissionNeeded}" value="Manual" id="trManual"/>
              <label class="form-check-label" for="trManual">Manual</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" th:field="*{transmissionNeeded}" value="Automatic" id="trAuto"/>
              <label class="form-check-label" for="trAuto">Automatic</label>
            </div>
          </div>
          <input type="hidden" th:field="*{vehicleId}" id="vehicleIdHidden"/>

          <button type="submit" class="btn-search">Search for Vehicles</button>
        </form>

        <div th:if="${vehicles != null}">
          <div class="mt-4 mb-2"><strong>Available Vehicles</strong></div>

          <div th:if="${#lists.isEmpty(vehicles)}" class="text-muted text-center py-3">
            No vehicles matched your criteria.
          </div>

          <div th:each="v,iterStat : ${vehicles}">
            <div class="vehicle-card" th:attr="data-price-per-day=${v.pricePerDay}, data-total=${v.totalPrice}">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <div class="vehicle-title" th:text="${v.brand} + ' ' + ${v.model} + ' (' + ${v.type} + ')'"></div>
                  <div style="font-size: 13px; color: #333; margin-top: 4px;">
                    Capacity: <span th:text="${v.capacity}">4</span>
                    &nbsp; • &nbsp; Transmission: <span th:text="${v.transmission}">Auto</span>
                  </div>
                </div>
                <div class="text-end ms-3">
                  <div style="font-size: 12px; color: #666;">Total Price:</div>
                  <div class="vehicle-price" th:text="'Rp ' + ${#numbers.formatDecimal(v.totalPrice, 0, 'COMMA', 2, 'POINT')}">Rp 0,00</div>
                </div>
              </div>
              <div class="form-check mt-2">
                <input class="form-check-input" type="radio" name="selectedVehicle" th:value="${v.id}" th:id="${'veh-' + iterStat.index}"/>
                <label class="form-check-label" th:for="${'veh-' + iterStat.index}"> Select </label>
              </div>
            </div>
          </div>

          <!-- PRICE DETAILS -->
          <div class="price-details-card" th:attr="data-rental-days=${rentalDays}">
            <div style="font-weight:600; margin-bottom:8px;">Booking Price Details</div>
            <div style="display:flex; justify-content:space-between;">
              <div>Price per Day (<span th:text="${rentalDays}">0</span> day(s))</div>
              <div id="pricePerDayDisplay">Rp 0,00</div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:12px; font-weight:700;">
              <div>Grand Total</div>
              <div id="grandTotal">-</div>
            </div>
          </div>

          <!-- PROCEED FORM (JS will populate hidden inputs and submit to /bookings/create/proceed) -->
          <form id="proceedForm" th:action="@{/bookings/create/proceed}" method="post">
            <div th:if="${_csrf != null}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </div>
          </form>

          <div class="d-flex justify-content-between mt-4">
            <a href="/bookings" class="btn-cancel">Cancel</a>
            <button id="proceedBtn" class="btn-proceed">Proceed to Add-ons</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const DRIVER_COST_PER_DAY = 100000;

  function formatRupiah(amount) {
    if (amount == null || Number.isNaN(Number(amount))) return 'Rp 0,00';
    return 'Rp ' + Number(amount).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function copyMainToProceed() {
    const main = document.getElementById('mainForm');
    const proceed = document.getElementById('proceedForm');
    // simpan CSRF jika ada
    const csrf = proceed.querySelector('input[name="_csrf"]');
    proceed.innerHTML = '';
    if (csrf) proceed.appendChild(csrf);

    // Daftar nama field yang wajib disalin (sesuaikan dengan DTO names)
    const names = ['pickUpLocation','dropOffLocation','pickUpTime','dropOffTime','capacityNeeded','transmissionNeeded','includeDriver'];

    names.forEach(name => {
      // coba ambil elemen di main form: by name first, else by id
      let el = main.querySelector('[name="'+name+'"]') || document.getElementById(name) || main.querySelector('#' + name);
      if (!el) {
        // jika tidak ada, coba th:field hidden yang mungkin ada dengan id
        el = main.querySelector('input[id="'+name+'"]');
      }
      if (!el) return;

      // Ambil nilai: untuk checkbox harus 'true'/'false'
      let value = '';
      if (el.type === 'checkbox') value = el.checked ? 'true' : 'false';
      else value = el.value || '';

      // pastikan tidak kosong untuk field wajib (pickUpTime/dropOffTime)
      if ((name === 'pickUpTime' || name === 'dropOffTime') && (value === null || value.trim() === '')) {
        // beri peringatan supaya user tahu
        // (atau kamu bisa throw dan redirect ke create dengan error message)
        alert('Pick-up time and Drop-off time harus terisi sebelum melanjutkan.');
        throw new Error('datetime-missing');
      }

      // buat hidden input
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = name;
      hidden.value = value;
      proceed.appendChild(hidden);
    });

    // ambil selected vehicle radio dan tambahkan vehicleId
    const selected = document.querySelector('input[name="selectedVehicle"]:checked');
    if (selected) {
      const hv = document.createElement('input');
      hv.type = 'hidden';
      hv.name = 'vehicleId';
      hv.value = selected.value;
      proceed.appendChild(hv);
    }
  }


  function updateGrandTotal() {
    const sel = document.querySelector('input[name="selectedVehicle"]:checked');
    const priceDetailsCard = document.querySelector('.price-details-card');
    const rentalDays = priceDetailsCard ? Number(priceDetailsCard.getAttribute('data-rental-days') || 0) : 0;

    if (!sel) {
      document.getElementById('grandTotal').textContent = '-';
      document.getElementById('pricePerDayDisplay').textContent = 'Rp 0,00';
      return;
    }

    const row = sel.closest('.vehicle-card');
    if (!row) return;

    const pricePerDayRaw = row.getAttribute('data-price-per-day');
    const pricePerDay = Number(pricePerDayRaw) || 0;

    const includeDriverCheckbox = document.getElementById('includeDriver');
    const includeDriver = includeDriverCheckbox ? includeDriverCheckbox.checked : false;

    const vehicleCost = pricePerDay * Math.max(1, rentalDays);
    const driverCost = includeDriver ? (DRIVER_COST_PER_DAY * Math.max(1, rentalDays)) : 0;
    const total = Math.round((vehicleCost + driverCost) * 100) / 100;

    document.getElementById('pricePerDayDisplay').textContent = formatRupiah(pricePerDay);
    document.getElementById('grandTotal').textContent = formatRupiah(total);
  }

  document.addEventListener('click', function (e) {
    if (e.target && e.target.matches('input[name="selectedVehicle"]')) updateGrandTotal();
    if (e.target && e.target.id === 'proceedBtn') {
      e.preventDefault();
      const selected = document.querySelector('input[name="selectedVehicle"]:checked');
      if (!selected) { alert('Please select a vehicle first.'); return; }
      copyMainToProceed();
      document.getElementById('proceedForm').submit();
    }
  });

  const includeDriverCheckbox = document.getElementById('includeDriver');
  if (includeDriverCheckbox) includeDriverCheckbox.addEventListener('change', updateGrandTotal);
  // initialize if server preselected or radio default
  updateGrandTotal();
</script>
</body>
</html>
