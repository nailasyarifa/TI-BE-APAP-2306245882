<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Cancel Booking Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 50px;
    }
    .card {
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card p-4 text-center">
    <div th:if="${status == 'success'}">
      <h3 class="text-success mb-3">Booking Berhasil Dibatalkan ✅</h3>
      <p th:text="${success}">Booking berhasil dibatalkan.</p>
      <a th:href="@{/bookings}" class="btn btn-success mt-3">Kembali ke Daftar Booking</a>
    </div>

    <div th:if="${status == 'error'}">
      <h3 class="text-danger mb-3">Pembatalan Gagal ❌</h3>
      <p th:text="${error}">Terjadi kesalahan saat membatalkan.</p>
      <a th:href="@{/bookings}" class="btn btn-secondary mt-3">Kembali</a>
    </div>
  </div>
</body>
</html>
