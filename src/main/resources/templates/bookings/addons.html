<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Choose Add-Ons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .card-centered { max-width: 800px; margin: 24px auto; }
    .addon-item { border-bottom:1px solid #eee; padding:12px 0; }
  </style>
</head>
<body>
<div class="container">
  <div class="card card-centered shadow-sm">
    <div class="card-body">
      <h5 class="card-title text-success">Choose Add-Ons</h5>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

      <form id="backForm" th:action="@{/bookings/create}" method="post" style="display:none;" th:object="${createReq}">
        <div th:if="${_csrf != null}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </div>
        <input type="hidden" th:field="*{vehicleId}"/>
        <input type="hidden" th:field="*{pickUpTime}"
               th:value="${createReq.pickUpTime != null ? #temporals.format(createReq.pickUpTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
        <input type="hidden" th:field="*{dropOffTime}"
               th:value="${createReq.dropOffTime != null ? #temporals.format(createReq.dropOffTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
        <input type="hidden" th:field="*{pickUpLocation}"/>
        <input type="hidden" th:field="*{dropOffLocation}"/>
        <input type="hidden" th:field="*{capacityNeeded}"/>
        <input type="hidden" th:field="*{transmissionNeeded}"/>
        <input type="hidden" th:field="*{includeDriver}"/>
      </form>

      <form id="saveForm" th:action="@{/bookings/create/save}" method="post" th:object="${createReq}">
        <div th:if="${_csrf != null}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </div>

        <input type="hidden" th:field="*{vehicleId}"/>
        <input type="hidden" th:field="*{pickUpTime}"
               th:value="${createReq.pickUpTime != null ? #temporals.format(createReq.pickUpTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
        <input type="hidden" th:field="*{dropOffTime}"
               th:value="${createReq.dropOffTime != null ? #temporals.format(createReq.dropOffTime, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
        <input type="hidden" th:field="*{pickUpLocation}"/>
        <input type="hidden" th:field="*{dropOffLocation}"/>
        <input type="hidden" th:field="*{capacityNeeded}"/>
        <input type="hidden" th:field="*{transmissionNeeded}"/>
        <input type="hidden" th:field="*{includeDriver}"/>

        <div class="mb-3">
          <label class="form-label"><strong>Available Add-Ons</strong></label>
          <div th:if="${#lists.isEmpty(addOns)}" class="text-muted">No add-ons available.</div>

          <div th:each="a : ${addOns}" class="addon-item row align-items-center">
            <div class="col-1">
              <!-- name "addonIds" multiple -> binds to List<String> in DTO -->
              <input type="checkbox" th:id="${'addon-' + a.id}" name="addonIds" th:value="${a.id}" class="form-check-input"/>
            </div>
            <div class="col-8">
              <label th:for="${'addon-' + a.id}" th:text="${a.name}">Addon name</label>
            </div>
            <div class="col-3 text-end text-success" th:text="${#numbers.formatDecimal(a.price,0,'COMMA',2,'POINT')}">Rp 0,00</div>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-outline-secondary" id="btnPrevious">Previous</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script>
  // clicking Previous submits hidden backForm (which contains all createReq fields)
  document.getElementById('btnPrevious').addEventListener('click', function () {
    document.getElementById('backForm').submit();
  });
</script>
</body>
</html>
