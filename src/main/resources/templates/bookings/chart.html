<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Rental Booking Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root { --primary-green: #28a745; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; background:#fff; padding:0; margin:0; }

    /* ---------- NAVBAR ---------- */
    .container-custom { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .navbar-custom {
      background-color: white;
      border-bottom: 1px solid #e6efe8;
      padding: 12px 0;
      box-sizing: border-box;
    }
    .navbar-inner {
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .navbar-brand {
      color: var(--primary-green);
      font-weight: 700;
      font-size: 1.25rem;
      text-decoration: none;
    }
    .nav-links { display:flex; gap:20px; align-items:center; }
    .nav-link-custom {
      color: #6c757d;
      text-decoration: none;
      font-weight: 500;
      transition: color .15s ease;
    }
    .nav-link-custom:hover { color: #2c8a3f; }

    /* ---------- PAGE LAYOUT ---------- */
    .page-wrapper { padding: 28px 12px; }
    .panel { max-width: 1000px; margin: 18px auto; }
    .controls { display:flex; gap:12px; align-items:center; margin-bottom:18px; justify-content:center; flex-wrap:wrap; }
    .chart-card { background:#fff; border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,0.06); padding:18px; }
    .table-stats { margin-top:14px; overflow-x:auto; }

    /* responsive */
    @media (max-width: 640px) {
      .container-custom { padding: 0 10px; }
      .panel { padding: 0 8px; }
    }
  </style>
</head>
<body>

  <!-- MANUAL NAVBAR (embedded) -->
  <header class="navbar-custom">
    <div class="container-custom">
      <div class="navbar-inner">
        <a href="/" class="navbar-brand">Vehicle Rental App</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/" class="nav-link-custom">Home</a>
          <a href="/vehicles" class="nav-link-custom">Vehicles</a>
          <a href="/bookings" class="nav-link-custom">Bookings</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <div class="page-wrapper">
    <div class="panel">
      <h2 class="text-center" style="color:var(--primary-green); font-weight:700; margin-top:8px;">Rental Booking Dashboard</h2>

      <div class="controls">
        <label style="margin-right:6px;">View By:</label>
        <select id="periodSelect" class="form-select" style="width:160px;">
          <option value="monthly" th:selected="${selectedPeriod == 'monthly'}">Monthly</option>
          <option value="quarterly" th:selected="${selectedPeriod == 'quarterly'}">Quarterly</option>
        </select>

        <label style="margin-left:8px;">Year:</label>
        <select id="yearSelect" class="form-select" style="width:120px;">
          <option th:each="y : ${years}" th:value="${y}" th:text="${y}" th:selected="${y == selectedYear}"></option>
        </select>

        <button id="btnRefresh" class="btn btn-primary">Refresh</button>
      </div>

      <div class="chart-card">
        <h6 id="chartTitle" style="margin-bottom:12px;">Booking Results</h6>
        <div style="overflow:auto;">
          <canvas id="bookingChart" width="900" height="320"></canvas>
        </div>

        <div class="table-stats">
          <table class="table table-bordered table-sm">
            <thead>
              <tr id="tableHeader"></tr>
            </thead>
            <tbody>
              <tr id="tableData"></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const ctx = document.getElementById('bookingChart').getContext('2d');
    let bookingChart = null;

    function buildTable(labels, data) {
      const headerRow = document.getElementById('tableHeader');
      const dataRow = document.getElementById('tableData');
      headerRow.innerHTML = '';
      dataRow.innerHTML = '';
      labels.forEach(l => {
        const th = document.createElement('th');
        th.style.textAlign = 'center';
        th.textContent = l;
        headerRow.appendChild(th);
      });
      labels.forEach((l, i) => {
        const td = document.createElement('td');
        td.style.textAlign = 'center';
        td.textContent = data[i];
        dataRow.appendChild(td);
      });
    }

    function renderChart(labels, data, period, year) {
      const title = document.getElementById('chartTitle');
      title.textContent = `Booking Results (${period.charAt(0).toUpperCase() + period.slice(1)}) for ${year}`;

      if (bookingChart) bookingChart.destroy();

      bookingChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Reservations',
            data: data,
            backgroundColor: labels.map(() => 'rgba(40,167,69,0.75)'),
            borderColor: labels.map(() => 'rgba(40,167,69,1)'),
            borderWidth: 1
          }]
        },
        options: {
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            }
          },
          maintainAspectRatio: false
        }
      });

      buildTable(labels, data);
    }

    async function fetchAndRender() {
      const period = document.getElementById('periodSelect').value;
      const year = document.getElementById('yearSelect').value;
      const url = `/api/bookings/chart?period=${encodeURIComponent(period)}&year=${encodeURIComponent(year)}`;

      try {
        const resp = await fetch(url, { credentials: 'same-origin' });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          alert('Error fetching chart data: ' + (err.message || resp.statusText));
          return;
        }
        const json = await resp.json();
        const labels = json.labels || [];
        const data = json.data || [];
        renderChart(labels, data, period, year);
      } catch (err) {
        console.error(err);
        alert('Terjadi kesalahan saat mengambil data statistik.');
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', fetchAndRender);
    document.getElementById('periodSelect').addEventListener('change', fetchAndRender);
    document.getElementById('yearSelect').addEventListener('change', fetchAndRender);

    // initial
    fetchAndRender();
  </script>
</body>
</html>
