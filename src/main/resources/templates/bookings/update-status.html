<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Update Booking Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root{
      --primary-green: #22c55e;
      --dark-gray: #374151;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --border: #e6e6e6;
    }
    body{ background:#f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:#111827; }
    .card { border-radius: 10px; box-shadow: 0 6px 20px rgba(16,24,40,0.06); border: 1px solid var(--border); }
    .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
    .card-body { padding: 1.5rem; }
    .page-title { color: var(--primary-green); font-weight: 700; margin: 0 0 0.5rem 0; font-size: 1.25rem; display:flex; align-items:center; gap:0.5rem; }
    .hr-line { height:2px; background:#0000001f; margin-top:.25rem; margin-bottom:1rem; }
    .label { font-size:0.85rem; color:var(--muted); margin-bottom:0.35rem; font-weight:600; }
    .value-strong { font-weight:700; color:#111827; }
    .status-pill { display:inline-block; padding:0.35rem .75rem; border-radius:8px; font-weight:700; }
    .s-upcoming { background:#fff7ed; color:#92400e; }
    .s-ongoing { background:#e0f2fe; color:#0c4a6e; }
    .s-done { background:#ecfdf5; color:#065f46; }

    .form-select, .form-control { border-radius:8px; padding:.6rem .75rem; }
    .btn-back { background:#6b7280; color:white; border-radius:8px; padding:.65rem 1rem; border:none; font-weight:700; }
    .btn-save { background:var(--primary-green); color:white; border-radius:8px; padding:.65rem 1rem; border:none; font-weight:700; }
    .btn-back:hover { background:#52565d; }
    .btn-save:hover { background:#16a34a; }

    .footer-actions { display:flex; gap:1rem; margin-top:1.25rem; }
    @media (max-width:576px){ .footer-actions{ flex-direction:column } }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="card mx-auto" style="max-width:900px;">
      <div class="card-header">
        <div class="page-title">Update Booking Status</div>
        <div class="hr-line"></div>
      </div>

      <div class="card-body">
        <form th:action="@{/bookings/{id}/status(id=${booking.id})}" method="post">
          <input type="hidden" name="_method" value="post"/>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <div class="label">Booking ID</div>
              <div class="value-strong" th:text="${booking.id}">VR000005</div>
            </div>

            <div class="col-12 col-md-6">
              <div class="label">Current Status</div>
              <div>
                <span class="status-pill"
                      th:classappend="${booking.status != null ? (booking.status.name().toLowerCase() == 'upcoming' ? ' s-upcoming' : (booking.status.name().toLowerCase() == 'ongoing' ? ' s-ongoing' : ' s-done')) : ' s-upcoming'}"
                      th:text="${booking.status != null ? booking.status.name().substring(0,1).toUpperCase() + booking.status.name().substring(1).toLowerCase() : 'Unknown'}">Upcoming</span>
              </div>
            </div>

            <div class="col-12">
              <div class="label">Select new status:</div>
              <label class="label" style="margin-top:0.25rem;">New Status</label>
              <select name="status" class="form-select" required>
                <option value="" selected>--Select Status--</option>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s.substring(0,1).toUpperCase() + s.substring(1).toLowerCase()}">
                </option>
              </select>
            </div>
          </div>

          <div class="footer-actions" style="justify-content:flex-end;">
            <a th:href="@{/bookings/{id}(id=${booking.id})}" class="btn-back" role="button">Back</a>
            <button type="submit" class="btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
