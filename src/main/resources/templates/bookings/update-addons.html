<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Update Booking Add-Ons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width:720px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="text-success">Update Booking Add-Ons</h3>
        <hr/>

        <form th:action="@{/bookings/update-addons}" method="post" th:object="${updateReq}">
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <input type="hidden" th:field="*{id}" />
          <input type="hidden" th:field="*{vehicleId}" />
          <input type="hidden" name="pickUpTime" th:value="${#temporals.format(updateReq.pickUpTime,'yyyy-MM-dd''T''HH:mm:ss')}" />
          <input type="hidden" name="dropOffTime" th:value="${#temporals.format(updateReq.dropOffTime,'yyyy-MM-dd''T''HH:mm:ss')}" />
          <input type="hidden" th:field="*{pickUpLocation}" />
          <input type="hidden" th:field="*{dropOffLocation}" />
          <input type="hidden" th:field="*{capacityNeeded}" />
          <input type="hidden" name="transmission" th:value="${updateReq.transmission}" />
          <input type="hidden" name="includeDriver" th:value="${updateReq.includeDriver}" />
          <div class="mb-3">
            <label class="form-label"><strong>Choose Add-Ons</strong></label>
            <input type="hidden" name="addonIds" value="" />

            <div th:each="ao : ${addOns}">
              <label class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded">
                <div class="d-flex align-items-center">
                  <input type="checkbox" th:name="addonIds" th:value="${ao.id}"
                         th:checked="${updateReq.addonIds != null and updateReq.addonIds.contains(ao.id.toString())}" />
                  <span th:text="${ao.name}" style="margin-left:8px;"></span>
                </div>
                <div class="text-success fw-semibold" th:text="${#numbers.formatDecimal(ao.price,0,'COMMA',2,'POINT')}"></div>
              </label>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success btn-lg">Save</button>
            <a th:href="@{/bookings/{id}(id=${updateReq.id})}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
