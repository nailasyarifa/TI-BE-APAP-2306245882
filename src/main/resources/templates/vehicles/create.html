<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Create Vehicle - Vehicle Rental App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family:Arial, sans-serif; background:#f6f8fa; margin:0; color:#333; }
        .container { max-width:720px; margin:40px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
        label { display:block; margin-top:12px; font-weight:700; color:#2f6f4a; }
        input[type="text"], input[type="number"], select { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #ddd; margin-top:6px; box-sizing:border-box; }
        .row { display:flex; gap:12px; }
        .col { flex:1; }
        .actions { margin-top:18px; display:flex; gap:12px; }
        .btn { padding:10px 14px; border-radius:8px; text-decoration:none; color:#fff; font-weight:700; border:none; cursor:pointer; }
        .btn-save { background:#28a745; }
        .btn-cancel { background:#6c757d; }
        .error { color:#c0392b; margin-top:6px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Create a New Vehicle</h2>

    <form th:action="@{/vehicles/create}" th:object="${vehicle}" method="post">
        <label>Rental Vendor</label>
        <select th:field="*{rentalVendorId}">
            <option value="">-- Select Vendor --</option>
            <option th:each="v : ${vendors}" th:value="${v.id}" th:text="${v.name}">Vendor 1</option>
        </select>

        <label>Vehicle Type</label>
        <select th:field="*{type}">
            <option value="">-- Select a Vehicle Type --</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="MPV">MPV</option>
            <option value="Luxury">Luxury</option>
        </select>

        <label>Vehicle Brand</label>
        <input type="text" th:field="*{brand}" placeholder="Toyota">

        <label>Vehicle Model</label>
        <input type="text" th:field="*{model}" placeholder="Avanza">

        <div class="row">
            <div class="col">
                <label>Production Year</label>
                <input type="number" th:field="*{productionYear}" min="1900" max="2100">
            </div>
            <div class="col">
                <label>Location</label>
                <input type="text" th:field="*{location}" placeholder="Jakarta">
            </div>
        </div>

        <label>License Plate</label>
        <input type="text" th:field="*{licensePlate}" placeholder="B 1234 ABC">

        <label>Capacity</label>
        <input type="number" th:field="*{capacity}" min="1">

        <label>Transmission</label>
        <select th:field="*{transmission}">
            <option value="">-- Select a Transmission --</option>
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic</option>
        </select>

        <label>Fuel Type</label>
        <select th:field="*{fuelType}">
            <option value="">-- Select a Fuel Type --</option>
            <option value="Bensin">Bensin</option>
            <option value="Diesel">Diesel</option>
            <option value="Listrik">Listrik</option>
            <option value="Hybrid">Hybrid</option>
        </select>

        <label>Price per Day</label>
        <input type="number" step="0.01" th:field="*{price}" min="0">

        <div class="actions">
            <a href="/vehicles" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-save">Save</button>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" style="color:green; margin-top:6px;" th:text="${success}"></div>
    </form>
</div>
</body>
</html>
