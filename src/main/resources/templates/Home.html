<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehicle Rental - Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --green: #2f9a46;
      --primary-green: #198754; 
      --soft-green: #ecf9ef;
      --card-radius: 14px;
    }

    .navbar-custom {
      background-color: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem 2rem;
    }

    .navbar-brand {
      color: var(--primary-green) !important;
      font-weight: 600;
      font-size: 1.25rem;
    }

    .nav-link-custom {
      color: #6c757d;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-link-custom:hover {
      color: var(--primary-green);
    }

    .nav-link-custom.active {
      color: var(--primary-green);
    }

    body{
      background: var(--soft-green);
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#222;
    }

    /* topbar */
    .topbar {
      background: white;
      padding: 18px 42px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .brand {
      color: var(--green);
      font-weight: 700;
      font-size: 1.25rem;
    }
    .nav-right a { color:#555; margin-left: 18px; text-decoration:none; }

    /* hero area */
    .hero-wrap {
      padding: 56px 24px;
      display:flex;
      justify-content:center;
    }
    .hero-card {
      width: min(1100px, 92%);
      background: white;
      border-radius: 18px;
      padding: 48px 48px 56px;
      box-shadow: 0 18px 40px rgba(20,70,30,0.06);
    }
    .hero-title {
      font-size: 48px;
      font-weight: 800;
      text-align:center;
      margin-bottom:6px;
    }
    .hero-title .green { color: var(--green); }

    .hero-sub {
      text-align:center;
      color: #7b7b7b;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 28px;
      font-weight: 700;
      text-align:center;
      margin: 28px 0 18px;
    }

    /* stat cards row */
    .stats-row { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
    .stat {
      background: #fafafa;
      border-radius: 12px;
      padding:18px 26px;
      min-width: 260px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.03);
      display:flex;
      align-items:center;
      gap:16px;
    }
    .stat .icon {
      width:56px; height:56px; border-radius:50%;
      background: linear-gradient(135deg, rgba(46, 202, 113,0.12), rgba(46,202,113,0.06));
      display:flex; align-items:center; justify-content:center;
      font-size:24px;
    }
    .stat .meta { color:#7b7b7b; font-size:0.9rem; }
    .stat .value { font-size:28px; font-weight:700; margin-top:6px; }

    /* buttons */
    .hero-actions { display:flex; gap:18px; justify-content:center; margin-top:32px; }
    .btn-primary-custom {
      background: var(--green);
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight:700;
      box-shadow: 0 8px 18px rgba(47,154,70,0.18);
      color:white;
    }
    .btn-outline-custom {
      background: transparent;
      border: 2px solid #e6e6e6;
      color: #3b3b3b;
      padding: 10px 28px;
      border-radius: 12px;
      font-weight:700;
    }

    @media (max-width:760px){
      .hero-title { font-size:28px; }
      .stat { min-width: 200px; }
      .hero-card { padding:28px; }
    }
  </style>
</head>
<body>
<!-- Navigation -->
<div th:replace="~{navbar :: navbar('home')}"></div>
  <div class="hero-wrap">
    <div class="hero-card">
      <div class="hero-title">
        Welcome to <span class="green">Vehicle Rentals</span>
      </div>
      <div class="hero-sub">
        Find and book your ideal vehicle easily. Quick, reliable, and ready for your next adventure!
      </div>

      <div class="section-title">Platform Statistics</div>

      <div class="stats-row mt-3">
        <div class="stat">
          <div class="icon">🚗</div>
          <div>
            <div class="meta">Registered Vehicles</div>
            <div class="value" th:text="${totalVehicles}">0</div>
          </div>
        </div>

        <div class="stat">
          <div class="icon">👤</div>
          <div>
            <div class="meta">Registered Vendors</div>
            <div class="value" th:text="${totalVendors}">0</div>
          </div>
        </div>

        <div class="stat">
          <div class="icon">📅</div>
          <div>
            <div class="meta">Bookings Made</div>
            <div class="value" th:text="${totalBookings}">0</div>
          </div>
        </div>
      </div>

      <div class="hero-actions">
        <a class="btn btn-primary-custom" th:href="@{/vehicles}">See Vehicles</a>
        <a class="btn btn-primary-custom" th:href="@{/bookings}">Book Rentals</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
